# Three models. Each solves once and judges twice. No model judges itself:
# self-preference is eliminated by construction, and therefore excluded from
# the design rather than measured by it. Say this on stage.
n_rollouts: 10
max_turns: 8
usd_budget_per_rollout: 0.5
problem_idx: [3, 7, 9, 12, 16, 19, 24, 28]
configs:
  S1:
    solver: gpt-5.6-terra
    judges: [gemini-3.7-flash, grok-4.6]
  S2:
    solver: gemini-3.7-flash
    judges: [gpt-5.6-terra, grok-4.6]
  S3:
    solver: grok-4.6
    judges: [gpt-5.6-terra, gemini-3.7-flash]
