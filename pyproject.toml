[project]
name = "math-ai-harness"
version = "2.0.0"
description = "An evaluation harness and an LLM-as-a-judge pipeline for measuring how good an AI agent actually is at mathematics — the workshop, and the code behind it."
requires-python = ">=3.10"
# The harness core runs on the standard library alone, so `--mock` rehearses the
# entire workshop with nothing installed. See requirements.txt for the packages
# needed to talk to a real provider.
dependencies = []

[project.optional-dependencies]
providers = ["openai>=1.40", "google-genai>=1.0"]

[tool.uv]
package = false
